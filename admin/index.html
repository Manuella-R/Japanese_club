<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Japanese Club – Admin</title>
<style>
  :root { --dark:#2c2724; --cream:#f3eae5; --accent:#b4443a; --line:#e2d8d1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:#faf6f3; color:var(--dark); }
  header { background:var(--dark); color:var(--cream); padding:.8rem 1.2rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0; }
  main { max-width:960px; margin:0 auto; padding:1.2rem; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
  label { display:block; font-size:.8rem; font-weight:600; margin:.6rem 0 .2rem; }
  input, textarea, select { width:100%; padding:.5rem .6rem; border:1px solid #cdbfb6; border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  button { font:inherit; cursor:pointer; border:1px solid var(--dark); background:#fff; color:var(--dark); padding:.45rem .9rem; border-radius:8px; }
  button.primary { background:var(--dark); color:var(--cream); }
  button.danger { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; }
  .row > * { flex:1 1 150px; } .row > button { flex:0 0 auto; }
  .tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
  .tabs button.on { background:var(--dark); color:var(--cream); }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem; }
  .msg { padding:.6rem .9rem; border-radius:8px; margin:0 0 1rem; font-size:.9rem; }
  .msg.ok { background:#e6f4ea; } .msg.err { background:#fde8e6; } .msg.info { background:#eef3fb; }
  .hint { font-size:.8rem; opacity:.7; margin:.3rem 0; }
  .tools { display:flex; gap:.3rem; }
  .tools button { padding:.2rem .6rem; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.7rem; }
  .imgs .card { margin:0; padding:.5rem; }
  .imgs img { width:100%; height:110px; object-fit:cover; border-radius:8px; display:block; cursor:pointer; }
  .thumb { height:70px; width:100px; object-fit:cover; border-radius:6px; vertical-align:middle; margin-right:.5rem; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:1rem; z-index:10; }
  .modal .card { max-width:760px; width:100%; max-height:85vh; overflow:auto; margin:0; }
  .hidden { display:none !important; }
  .past { opacity:.55; }
  .login { max-width:420px; margin:12vh auto; }
</style>
</head>
<body>
<header><h1>🎌 Japanese Club – Admin</h1><div id="who" class="hidden"><span id="whoName"></span> <button id="logout">Sign out</button></div></header>
<main>
  <!-- LOGIN -->
  <section id="login" class="card login">
    <h2 style="margin-top:0">Admin sign-in</h2>
    <p class="hint">Paste your GitHub personal access token. It is kept only in this browser tab (cleared when you close it) and is sent only to api.github.com.</p>
    <label for="tok">GitHub token</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" />
    <p style="margin-top:1rem"><button class="primary" id="loginBtn">Sign in</button></p>
    <div id="loginMsg"></div>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <div id="msg"></div>
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </section>
</main>

<div id="picker" class="modal hidden"></div>

<script>
/* ---------- CONFIG ---------- */
const OWNER = 'Manuella-R', REPO = 'Japanese_club', BRANCH = 'main';
const TABS = { years:'Our Years', events:'Events', gallery:'Gallery', learn:'Learn Japanese', admins:'Admins' };
const FILES = { years:'data/years.json', events:'data/events.json', gallery:'data/gallery.json', admins:'data/admins.json' };

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = (t='') => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = sessionStorage.getItem('jc_token') || '';
let me = null, perms = [];
const state = {}, shas = {}, dirty = {};
let tab = null, yearIdx = 0;

async function gh(path, opts = {}) {
  const url = path.startsWith('http') ? path : `https://api.github.com/repos/${OWNER}/${REPO}/${path}`;
  const r = await fetch(url, { ...opts, headers: { Accept:'application/vnd.github+json', Authorization:'Bearer '+token, ...(opts.headers||{}) } });
  if (!r.ok) { const e = new Error(r.status === 401 ? 'Token rejected by GitHub.' : r.status === 403 || r.status === 404 ? 'GitHub says this token cannot access the repository (needs Contents: read & write).' : r.status === 409 || r.status === 422 ? 'Conflict: the file changed on GitHub since you loaded it. Reload and re-apply your change.' : 'GitHub error ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')), c => c.charCodeAt(0)));
const b64enc = s => { const b = new TextEncoder().encode(s); let t=''; b.forEach(c => t += String.fromCharCode(c)); return btoa(t); };
async function readFile(key) {
  const f = await gh(`contents/${FILES[key]}?ref=${BRANCH}&t=${Date.now()}`);
  shas[key] = f.sha; state[key] = JSON.parse(b64dec(f.content)); dirty[key] = false;
}
async function saveFile(key, message) {
  const res = await gh(`contents/${FILES[key]}`, { method:'PUT', body: JSON.stringify({ message, branch:BRANCH, sha:shas[key], content:b64enc(JSON.stringify(state[key], null, 2) + '\n') }) });
  shas[key] = res.content.sha; dirty[key] = false;
}
function notify(text, kind='info') { $('#msg').innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ''; if (text) window.scrollTo({ top:0, behavior:'smooth' }); }
const getP = (path) => path.split('.').reduce((o,k) => o[k], state);
const setP = (path, v) => { const k = path.split('.'); const last = k.pop(); k.reduce((o,x) => o[x], state)[last] = v; };
const fileKeyOf = path => path.split('.')[0];
const can = s => perms.includes('all') || perms.includes(s);

/* ---------- login ---------- */
async function login(t) {
  token = t.trim();
  const user = await gh('https://api.github.com/user');
  const repo = await gh('');
  if (!repo.permissions || !repo.permissions.push) throw new Error('This token cannot write to the club repository.');
  await readFile('admins');
  const entry = (state.admins.admins || []).find(a => a.user.toLowerCase() === user.login.toLowerCase());
  if (!entry) throw new Error(`@${user.login} is not on the admin list (data/admins.json).`);
  me = user.login; perms = entry.sections || [];
  sessionStorage.setItem('jc_token', token);
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#who').classList.remove('hidden');
  $('#whoName').textContent = '@' + me;
  const allowed = Object.keys(TABS).filter(k => k === 'admins' ? perms.includes('all') : (can(k) || (k==='learn' && can('gallery'))));
  $('#tabs').innerHTML = allowed.map(k => `<button data-tab="${k}">${TABS[k]}</button>`).join('');
  for (const k of ['years','events','gallery']) if (allowed.includes(k) || (k==='gallery' && allowed.includes('learn'))) await readFile(k);
  show(allowed[0]);
}
$('#loginBtn').onclick = async () => {
  const b = $('#loginBtn'); b.disabled = true; $('#loginMsg').innerHTML = '';
  try { await login($('#tok').value); } catch (e) { token=''; sessionStorage.removeItem('jc_token'); $('#loginMsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  b.disabled = false;
};
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#logout').onclick = () => { sessionStorage.removeItem('jc_token'); location.reload(); };
window.addEventListener('beforeunload', e => { if (Object.values(dirty).some(Boolean)) { e.preventDefault(); e.returnValue = ''; } });
if (token) login(token).catch(() => { sessionStorage.removeItem('jc_token'); });

/* ---------- navigation ---------- */
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); };
function show(k) {
  tab = k; notify('');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  ({ years:viewYears, events:viewEvents, gallery:() => viewImages('gallery'), learn:() => viewImages('learn'), admins:viewAdmins })[k]();
}
const saveBar = (key, label) => `<div class="bar"><h2 style="margin:0">${label}</h2><button class="primary" data-act="save" data-key="${key}">💾 Save &amp; publish</button></div>
  <p class="hint">Saving commits to GitHub; the live site updates about a minute later.</p>`;

/* ---------- generic input / action handling ---------- */
document.addEventListener('input', e => {
  const p = e.target.dataset.p; if (!p) return;
  let v = e.target.type === 'checkbox' ? e.target.checked : e.target.type === 'number' ? Number(e.target.value) : e.target.value;
  setP(p, v); dirty[fileKeyOf(p)] = true;
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, path = b.dataset.path, i = +b.dataset.i;
  const arr = path ? getP(path) : null;
  if (path) dirty[fileKeyOf(path)] = true;
  if (a === 'up' && i > 0) [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  else if (a === 'down' && i < arr.length-1) [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
  else if (a === 'del') { if (!confirm('Remove this item?')) return; arr.splice(i, 1); }
  else if (a === 'save') return doSave(b);
  else if (a === 'add') arr.push(JSON.parse(b.dataset.tpl));
  else if (a === 'pick') return pickImage(src => { setP(b.dataset.p, src); dirty[fileKeyOf(b.dataset.p)] = true; show(tab); });
  else if (a === 'addYear') return addYear();
  else if (a === 'delYear') { if (!confirm('Delete this whole year and its entries?')) return; state.years.years.splice(yearIdx, 1); yearIdx = 0; dirty.years = true; }
  else if (a === 'upload') return $('#file-' + b.dataset.sec).click();
  show(tab);
});
async function doSave(b) {
  const key = b.dataset.key; b.disabled = true;
  try { await saveFile(key, `Admin (${me}): update ${key}`); notify('✅ Saved. The site will refresh in about a minute.', 'ok'); }
  catch (e) { notify('❌ ' + esc(e.message), 'err'); }
  b.disabled = false;
}

/* ---------- images ---------- */
function resize(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('Could not read ' + file.name)); img.src = url;
  });
}
async function uploadFile(file) {
  const name = `${Date.now()}-${file.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)}.jpg`;
  const path = `assets/uploads/${name}`;
  await gh(`contents/${path}`, { method:'PUT', body: JSON.stringify({ message:`Admin (${me}): upload ${name}`, branch:BRANCH, content: await resize(file) }) });
  return path;
}
function viewImages(section) {
  const imgs = state.gallery.images, learn = section === 'learn';
  const items = imgs.map((im, i) => ({ im, i })).filter(({ im }) => (im.section || 'gallery') === section);
  $('#panel').innerHTML = saveBar('gallery', learn ? 'Learn Japanese images' : 'Gallery photos') +
    `<div class="card"><button data-act="upload" data-sec="${section}">⬆ Upload images</button>
     <input id="file-${section}" type="file" accept="image/*" multiple class="hidden" />
     <p class="hint">Photos are resized to 1600px before upload. Removing an image here takes it off the website (the file stays in the repo).</p></div>
     <div class="imgs">${items.map(({ im, i }) => `<div class="card"><img src="../${esc(im.src)}" alt="" data-open="../${esc(im.src)}" />
       <label>${learn ? 'Title' : 'Caption'}</label><input data-p="gallery.images.${i}.caption" value="${esc(im.caption)}" />
       ${learn ? '' : `<label>Year</label><input data-p="gallery.images.${i}.year" value="${esc(im.year)}" placeholder="e.g. 2025" />`}
       <div class="tools" style="margin-top:.5rem"><button data-act="up" data-path="gallery.images" data-i="${i}">↑</button><button data-act="down" data-path="gallery.images" data-i="${i}">↓</button><button class="danger" data-act="del" data-path="gallery.images" data-i="${i}">✕</button></div></div>`).join('') || '<p class="hint">No images yet.</p>'}</div>`;
  $('#file-' + section).onchange = async ev => {
    notify('Uploading…');
    try { for (const f of ev.target.files) { const src = await uploadFile(f); imgs.push({ src, caption:'', year: learn ? '' : String(new Date().getFullYear()), section }); }
      dirty.gallery = true; show(tab); notify('Uploaded. Add captions, then press Save &amp; publish so the images appear on the site.', 'ok'); }
    catch (e) { notify('❌ ' + esc(e.message), 'err'); }
  };
}
$('#panel').addEventListener('click', e => { const i = e.target.closest('[data-open]'); if (i) window.open(i.dataset.open); });
function pickImage(cb) {
  const m = $('#picker'); m.classList.remove('hidden');
  m.innerHTML = `<div class="card"><div class="bar"><h3 style="margin:0">Choose an image</h3><div><button id="pkUp">⬆ Upload new</button> <button id="pkX">Close</button></div></div>
    <input id="pkFile" type="file" accept="image/*" class="hidden" /><div class="imgs">${state.gallery.images.map(im => `<div class="card"><img src="../${esc(im.src)}" data-src="${esc(im.src)}" /></div>`).join('')}</div></div>`;
  m.onclick = e => { if (e.target === m || e.target.id === 'pkX') m.classList.add('hidden'); const i = e.target.closest('img[data-src]'); if (i) { m.classList.add('hidden'); cb(i.dataset.src); } };
  $('#pkUp').onclick = () => $('#pkFile').click();
  $('#pkFile').onchange = async ev => { try { const src = await uploadFile(ev.target.files[0]); state.gallery.images.push({ src, caption:'', year:'', section:'gallery' }); dirty.gallery = true; m.classList.add('hidden'); cb(src); } catch (er) { notify('❌ ' + esc(er.message), 'err'); } };
}

/* ---------- years ---------- */
function addYear() {
  const y = prompt('Which year? (e.g. 2026)'); if (!y) return;
  if (state.years.years.some(v => v.year === y.trim())) return alert('That year already exists.');
  state.years.years.unshift({ year:y.trim(), title:'', intro:'', stats:[], entries:[] }); yearIdx = 0; dirty.years = true; show(tab);
}
function viewYears() {
  const ys = state.years.years; if (yearIdx >= ys.length) yearIdx = 0;
  const y = ys[yearIdx], P = `years.years.${yearIdx}`;
  $('#panel').innerHTML = saveBar('years', 'Our Years') +
  `<div class="card"><div class="row"><div><label>Year</label><select id="yearSel">${ys.map((v,i) => `<option value="${i}" ${i===yearIdx?'selected':''}>${esc(v.year)}</option>`).join('')}</select></div>
     <button data-act="addYear">＋ New year</button><button class="danger" data-act="delYear">Delete year</button></div></div>` +
  (!y ? '<p class="hint">No years yet – add one.</p>' : `
  <div class="card"><label>Year label</label><input data-p="${P}.year" value="${esc(y.year)}" />
    <label>Subtitle (shown after the year)</label><input data-p="${P}.title" value="${esc(y.title)}" placeholder="e.g. Highlights" />
    <label>Intro paragraph</label><textarea data-p="${P}.intro">${esc(y.intro)}</textarea></div>
  <div class="card"><h3 style="margin-top:0">Stat cards <button data-act="add" data-path="${P}.stats" data-tpl='${esc(JSON.stringify({icon:'⭐',value:0,label:'New stat'}))}'>＋</button></h3>
    ${y.stats.map((s,i) => `<div class="row"><div style="flex:0 0 70px"><label>Icon</label><input data-p="${P}.stats.${i}.icon" value="${esc(s.icon)}" /></div><div style="flex:0 0 100px"><label>Number</label><input type="number" data-p="${P}.stats.${i}.value" value="${+s.value||0}" /></div><div><label>Label</label><input data-p="${P}.stats.${i}.label" value="${esc(s.label)}" /></div><button class="danger" data-act="del" data-path="${P}.stats" data-i="${i}">✕</button></div>`).join('') || '<p class="hint">No stat cards for this year.</p>'}</div>
  <div class="bar"><h3 style="margin:0">Highlights / events (${y.entries.length})</h3>
    <button data-act="add" data-path="${P}.entries" data-tpl='${esc(JSON.stringify({title:'New entry',tag:'',text:'',image:'',highlight:false}))}'>＋ Add entry</button></div>
  ${y.entries.map((en,i) => `<div class="card"><div class="row"><div><label>Title</label><input data-p="${P}.entries.${i}.title" value="${esc(en.title)}" /></div><div><label>Tag (optional)</label><input data-p="${P}.entries.${i}.tag" value="${esc(en.tag)}" /></div></div>
    <label>Description <span class="hint">(use **double asterisks** for bold)</span></label><textarea data-p="${P}.entries.${i}.text">${esc(en.text)}</textarea>
    <label>Image</label><div>${en.image ? `<img class="thumb" src="../${esc(en.image)}" alt="" />` : ''}<input data-p="${P}.entries.${i}.image" value="${esc(en.image)}" placeholder="(none)" style="width:60%"> <button data-act="pick" data-p="${P}.entries.${i}.image">Choose / upload</button></div>
    <label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" style="width:auto" data-p="${P}.entries.${i}.highlight" ${en.highlight?'checked':''}> Highlight this entry</label>
    <div class="tools" style="margin-top:.6rem"><button data-act="up" data-path="${P}.entries" data-i="${i}">↑</button><button data-act="down" data-path="${P}.entries" data-i="${i}">↓</button><button class="danger" data-act="del" data-path="${P}.entries" data-i="${i}">Remove</button></div></div>`).join('')}`);
  const sel = $('#yearSel'); if (sel) sel.onchange = () => { yearIdx = +sel.value; viewYears(); };
}

/* ---------- events ---------- */
function viewEvents() {
  const ev = state.events.events, d0 = new Date(), today = `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`;
  $('#panel').innerHTML = saveBar('events', 'Upcoming events') +
  `<p class="hint">Events disappear from the site automatically the day after their date.</p>
   <button data-act="add" data-path="events.events" data-tpl='${esc(JSON.stringify({title:'',date:today,time:'',location:'',description:'',link:''}))}'>＋ Add event</button><br><br>` +
  ev.map((e,i) => `<div class="card ${e.date < today ? 'past' : ''}"><div class="row"><div style="flex:2 1 220px"><label>Title</label><input data-p="events.events.${i}.title" value="${esc(e.title)}" /></div>
    <div><label>Date</label><input type="date" data-p="events.events.${i}.date" value="${esc(e.date)}" /></div><div><label>Time</label><input type="time" data-p="events.events.${i}.time" value="${esc(e.time)}" /></div></div>
    <label>Location</label><input data-p="events.events.${i}.location" value="${esc(e.location)}" />
    <label>Description</label><textarea data-p="events.events.${i}.description">${esc(e.description)}</textarea>
    <label>Link (optional, https://…)</label><input data-p="events.events.${i}.link" value="${esc(e.link)}" />
    <p class="hint">${e.date < today ? 'Past event – hidden from the site.' : ''}</p>
    <div class="tools"><button class="danger" data-act="del" data-path="events.events" data-i="${i}">Remove</button></div></div>`).join('') || '<p class="hint">No events yet.</p>';
}

/* ---------- admins ---------- */
function viewAdmins() {
  const list = state.admins.admins, opts = ['years','events','gallery'];
  $('#panel').innerHTML = saveBar('admins', 'Admins') +
  `<p class="hint">Only people listed here can use this page. <b>"all"</b> = everything including this list. This list controls the page; real write access is also controlled by who holds a GitHub token for this repo.</p>
   <button data-act="add" data-path="admins.admins" data-tpl='${esc(JSON.stringify({user:'',sections:['events']}))}'>＋ Add admin</button><br><br>` +
  list.map((a,i) => `<div class="card"><label>GitHub username</label><input data-p="admins.admins.${i}.user" value="${esc(a.user)}" />
    <label>Can edit</label><select data-sel="${i}"><option value="all" ${a.sections.includes('all')?'selected':''}>Everything (full admin)</option>
      ${opts.map(o => `<option value="${o}" ${a.sections.length===1&&a.sections[0]===o?'selected':''}>${TABS[o]} only</option>`).join('')}<option value="years,events,gallery" ${a.sections.join()==='years,events,gallery'?'selected':''}>Content (no admin list)</option></select>
    <div class="tools" style="margin-top:.6rem"><button class="danger" data-act="del" data-path="admins.admins" data-i="${i}">Remove</button></div></div>`).join('');
  document.querySelectorAll('[data-sel]').forEach(s => s.onchange = () => { list[+s.dataset.sel].sections = s.value.split(','); dirty.admins = true; });
}
</script>
</body>
</html>
